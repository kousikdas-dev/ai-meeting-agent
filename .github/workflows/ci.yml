name: .NET 8 CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Packages
      run: dotnet restore AiMeetingAgent.sln

    - name: Build Solution
      run: dotnet build AiMeetingAgent.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test tests/AiMeetingAgent.Tests/AiMeetingAgent.Tests.csproj --configuration Release --no-build --verbosity normal